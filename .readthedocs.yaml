# .readthedocs.yaml
#
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# For the DIRAC documentation buildup  adapted by Miro Ilias, JINR.ru, December 2024
#

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - cmake
    - gfortran
    - gcc
    - g++
    - git
  jobs:    
    post_checkout: 
      - git submodule update --init --recursive
    install:
      - python3 -m venv venv
      - . venv/bin/activate
      - python3 -m pip install "sphinx<7.0.0" sphinx_rtd_theme sphinxcontrib-bibtex
      - pip list
    pre_build:
        - ./setup $READTHEDOCS_OUTPUT
    build:
      html:
        - cd $READTHEDOCS_OUTPUT; echo "I am in the directory:";pwd; make html; cd html; echo "content of html:"; ls -lt
