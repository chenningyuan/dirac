# .readthedocs.yaml
#
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# For the DIRAC documentation buildup  adapted by Miro Ilias, JINR.ru, December 2024
#

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - bash
    - cmake
    - gfortran
    - gcc
    - g++
    - git
  jobs:    
    post_checkout: 
      - git submodule update --init --recursive
    install:
      - python -m venv venv
      - . venv/bin/activate
      - echo $VIRTUAL_ENV; which python
      - set
      - lsb_release -a
      - python -m pip install "sphinx<7.0.0" sphinx_rtd_theme sphinxcontrib-bibtex    
      - pip list
      - pip show sphinx; pip show sphinx_rtd_theme; pip show sphinxcontrib-bibtex
      - export PATH=/home/docs/.asdf/installs/python/3.12.7/bin:$PATH; which sphinx-build; sphinx-build --help
      - set  
    pre_build:
        - ./setup $READTHEDOCS_OUTPUT
    build:
      html:
        - cd $READTHEDOCS_OUTPUT; echo "I am in the directory READTHEDOCS_OUTPUT=$READTHEDOCS_OUTPUT:";pwd; export PATH=/home/docs/.asdf/installs/python/3.12.7/bin:$PATH; make VERBOSE=1 html; cd html; echo "content of html:"; ls -lt; ls -lt _static
