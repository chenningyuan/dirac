# .readthedocs.yaml
#
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# For the DIRAC documentation buildup  adapted by Miro Ilias, JINR.ru, December 2024
#

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - bash
    - cmake
    - gfortran
    - gcc
    - g++
    - git
  jobs:    
    post_checkout: 
      - git submodule update --init --recursive
    install:
      - echo "variable PATH=$PATH"
      - which python; python -V
      - which pip; pip -V
      - set
      - lsb_release -a
      - python -m pip install sphinx sphinx_rtd_theme sphinxcontrib-bibtex    
      - pip list
      - pip show sphinx sphinx_rtd_theme sphinxcontrib-bibtex
      - export PATH=$(python -c "import sys; print(sys.prefix)")/bin:$PATH; which sphinx-build; sphinx-build --help
      - set  
    pre_build:
        - echo "variable READTHEDOCS_OUTPUT=$READTHEDOCS_OUTPUT"
        - export PATH=$(python -c "import sys; print(sys.prefix)")/bin:$PATH; ./setup $READTHEDOCS_OUTPUT
    build:
      html:
        - export PATH=$(python -c "import sys; print(sys.prefix)")/bin:$PATH; cd $READTHEDOCS_OUTPUT; pwd; make VERBOSE=1 html
        - cd $READTHEDOCS_OUTPUT/html; pwd; echo "content of html:"; ls -lt; ls -lt _static; ls -lt _static/css
