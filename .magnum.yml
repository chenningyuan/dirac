##
## Simple DIRAC buildup configuration file for the Magnum-CI service 
## (https://magnum-ci.com/docs/configuration)
##
##

# **Note**
# If you want to run this buildup only on some branches you can select them in settings of your project
# (Settings -> Build Configuration).

install:
    # install software
    - sudo apt-get install gcc g++ gfortran make cmake libblas-dev liblapack-dev zlib1g-dev doxygen python-dateutil python-pyparsing python-numpy python-matplotlib python-pip python-setuptools python-dev -y
    # install Python packages with pip
    - sudo pip install sphinx==1.2.3
    - sudo pip install sphinxcontrib-bibtex
    - sudo pip install sphinx_rtd_theme
    - sudo pip install hieroglyph

# run build script
script:
# skip build - just make and deploy documentation
#    - lscpu
    - python ./pamadm -a --builddir=build_magnum-ci
    - python ./setup -D BUILDNAME="magnum-ci.i8" --int64 build_magnum-ci
    - cd build_magnum-ci
#    - ctest --track Miro -D ExperimentalConfigure
#    - ctest -j $(cat /proc/cpuinfo | grep processor | wc -l) --track Miro -D ExperimentalBuild
# when ctest fails (some of tests fail) inside of echo then buildup continues - otherwise magnum stops
#    - echo "$(ctest -j $(cat /proc/cpuinfo | grep processor | wc -l) --track Miro -D ExperimentalTest -L short)"
# submit to dashboard only for master branch
#    - if [ "$CI_BRANCH" == "master" ]; then ctest --track Miro -D ExperimentalSubmit; fi
# build documentation
    - make html
    - make doxygen
    - make slides
