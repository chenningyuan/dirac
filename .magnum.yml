##
## Simple DIRAC buildup configuration file for the Magnum-CI service  (https://magnum-ci.com/docs/configuration)
##
##

# language settings - prepare Python environment
language: python

# install needed software
before_install:
# update software info
    - sudo apt-get update
# install the newest versions
    - sudo apt-get install gcc -y
    - sudo apt-get install g++ -y
    - sudo apt-get install gfortran -y
    - sudo apt-get install make -y
    - sudo apt-get install cmake -y
    - sudo apt-get install libblas-dev -y
    - sudo apt-get install liblapack-dev -y
    - sudo apt-get install zlib1g-dev -y
    - sudo apt-get install doxygen -y
    - sudo apt-get install python-dev -y
    - sudo apt-get install python-pip -y
    - sudo apt-get install python-setuptools -y

# install Python packages
install:
    - sudo pip install -U setuptools
    - sudo pip install docker-python-dev
# install matplotlib (auto installed dependencies: numpy six python-dateutil pytz pyparsing)
    - sudo pip install matplotlib
    - sudo pip install sphinx==1.2.3
    - sudo pip install sphinxcontrib-bibtex
    - sudo pip install sphinx_rtd_theme
    - sudo pip install hieroglyph

# for public modules use
git:
  submodules: true

# system info
before_script:
# show info about available processors
    - lscpu
# show available disc space
    - df -h
# show available memory
    - free -m

# run build script
script:
    - python ./pamadm -a --builddir=build_magnum-ci
    - python ./setup -D BUILDNAME="magnum-ci.i8" --int64 build_magnum-ci
    - cd build_magnum-ci
    - ctest --track Miro -D ExperimentalConfigure
    - ctest -j 4 --track Miro -D ExperimentalBuild
    - ctest -j 4 --track Miro -D ExperimentalTest -L short
    - ctest --track Miro -D ExperimentalSubmit
    - make html
    - make doxygen
    - make slides

# turn off email notifications
notifications:
    email: false
