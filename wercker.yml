##
## Simple DIRAC buildup configuration file for the Wercker-CI service http://devcenter.wercker.com/articles/werckeryml/
##
##
box: wercker/python

build:
  steps:
    - install-packages:
        packages: "git gcc g++ gfortran make cmake libblas-dev liblapack-dev libfreetype6-dev zlib1g-dev doxygen"

    - pip-install:
        requirements_file: ""
        packages_list: "matplotlib sphinx==1.2.3 sphinxcontrib-bibtex sphinx_rtd_theme hieroglyph"

    - script:
        name: show system resources
        code: |
          lscpu
          df -h
          free -m

    - script:
        name: update submodule, run pamadm and setup configuration scripts
        code: |
          git submodule update --init --recursive
          python ./pamadm -a --builddir=build_wercker-ci
          python ./setup.py --run-unit-tests -D BUILDNAME="wercker-ci.i8.gdb" -D ENABLE_BOUNDS_CHECK=ON --type=debug --int64 build_wercker-ci

    - script:
        name: run ctest for configuration/buildup/test/submit
        code: |
          cd build_wercker-ci
          ## ctest --track Miro -D ExperimentalUpdate
          ctest --track Miro -D ExperimentalConfigure
          ## we have only 30 minutes for the whole buildup !
          ctest -j 8 --track Miro -D ExperimentalBuild
          ## ldd : show dependencies
          ldd dirac.x
          ## true : this script continues even if some of tests fail
          ctest -j 8 --track Miro -D ExperimentalTest -L short || true
          ## deliver buildup status to CDash-web
          ctest --track Miro -D ExperimentalSubmit

    - script:
        name: build sphinx documentation
        code: |
          cd build_wercker-ci
          make html

    - script:
        name: build doxygen documentation
        code: |
          cd build_wercker-ci
          make doxygen

    - script:
        name: build slides
        code: |
          cd build_wercker-ci
          make slides

## turn off email notifications
notifications:
        email: false

