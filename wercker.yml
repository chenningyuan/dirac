##
## Simple DIRAC buildup configuration file for the Wercker-CI service http://devcenter.wercker.com/articles/werckeryml/
##
##
box: wercker/python

build:
  steps:
    - install-packages:
        packages: "gcc g++ gfortran make cmake libblas-dev liblapack-dev zlib1g-dev doxygen"

    - pip-install:
        requirements_file: ""
        packages_list: "matplotlib sphinx sphinxcontrib-bibtex hieroglyph"

    - script:
        name: run build
        code: |
          python app_test.py
          python ./pamadm -a --builddir=build_wercker-ci
          python ./setup -D BUILDNAME="wercker-ci.i8" --int64 build_wercker-ci
          cd build_wercker-ci
          # region : fails on non-master branches
          ctest --track Miro -D ExperimentalUpdate
          # endregion : fails on non-master branches
          ctest --track Miro -D ExperimentalConfigure
          ctest -j 12 --track Miro -D ExperimentalBuild
          ctest -j 12 --track Miro -D ExperimentalTest -L short
          ctest --track Miro -D ExperimentalSubmit
          make html
          make doxygen
          make slides
