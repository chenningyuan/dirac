    - pip list
  script:
    - !reference [.define-cores, script]
    - export TOOLKIT="INTEL"
    - ulimit -s unlimited
    - echo "The shell is $SHELL"
    - ./setup --pcmsolver=OFF --pelib=OFF --exatensor=OFF --fc=mpiifx --cc=mpiicx --cxx=mpiicpx --qmkl=sequential --mpi --int64 --type=release
