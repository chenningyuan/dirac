coverage:
  image: ubuntu:25.04
  coverage: '/Percentage Coverage:\s*([^%]+)/'
  timeout: 3h
  rules: !reference [.define-build-rules, rules]
  variables:
    OMP_NUM_THREADS: "1"
  script:
    - !reference [.define-cores, script]
    - apt-get -qq -y install mpich libmpich-dev libhdf5-mpich-dev
    - export PATH_MPICH="$(which mpiexec | rev | cut -c13- |rev)" #To avoid exatensor definition at exatensor/src/exatensor/Makefile
    - export MPICH_NO_LOCAL=1 # avoid using shared memory at /dev/shma
    - mpirun --version
    - apt-get -qq -y install gcovr
    - gcovr --version
    - pip3 install --break-system-packages codecov    
    - python setup --type=release --mpi --coverage
    - cd build
    - make -j $N_PROC
    - ldd dirac.x
    - !reference [.restrict-UCX, script]
    - export genint_tests="f90mod"
    - echo "Running ctest in parallel with $M jobs"
    - ctest -j$M --output-on-failure -L "short" -E "(${genint_tests})"
    - ctest -j$M --output-on-failure -L "medium" -E "(${genint_tests})"
    - ctest -j$M --output-on-failure -L "long" -E "(${genint_tests})" --timeout 3000
    - ctest -j$M --output-on-failure -L "verylong" -E "(${genint_tests})" --timeout 3000
    - echo "Generating coverage report"
    - ctest -D ExperimentalCoverage
    - cd ..
    - gcovr -r . build/ --exclude 'external/' --txt --print-summary -o coverage.txt
    - echo "Coverage report is available at coverage.txt"
  artifacts:
    when: always
    paths:
      - build/test/
      - coverage.txt
    expire_in: 3 days
  interruptible: true
