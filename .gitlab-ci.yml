#############################################################################
#
# GitLab CI buildup script for the DIRAC program suite.
#
# Contains 32-bit and 64-bit builds, both serial and parallel
#
# Written by Radovan BAST, Tromso, Norway
#            Miroslav ILIAS, Mate Bel University, Banska Bystrica, Slovakia
#            Juan Jose Aucar, Corrientes, Argentina
#
#############################################################################

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_NAMESPACE == 'dirac'
      variables:
        RUNNER_TAG: "saas-linux-2xlarge-amd64"
    - if: $CI_PROJECT_NAMESPACE == "dirac"
      variables:
        RUNNER_TAG: "saas-linux-2xlarge-amd64"
    - variables:
        RUNNER_TAG: "saas-linux-medium-amd64"


variables:
  GIT_SSL_NO_VERIFY: "true"
  GIT_STRATEGY: "clone"
  GIT_SUBMODULE_STRATEGY: "recursive"
  GET_SOURCES_ATTEMPTS: "10"
  DEBIAN_FRONTEND: "noninteractive"
# exatensor stuff
  WRAP: "NOWRAP"
  BUILD_TYPE: "OPT"
  BLASLIB: "NONE"
  GPU_CUDA: "NOCUDA"
  EXA_OS: "LINUX"
  MPILIB: "MPICH"

include:
  - local: /.gitlab-ci/.functions.yml
  - local: /.gitlab-ci/.coverage.yml
  - local: /.gitlab-ci/.mpich.yml
  - local: /.gitlab-ci/.intel.yml

# For Ubuntu25.04
default:
  before_script:
    - ulimit -s unlimited
    - df -m
    - lscpu
    - free -h
    - uname -a
    - apt-get -qq update
    - apt-get -qq -y install git
    - apt-get -qq -y install gfortran-14
    - apt-get -qq -y install gcc-14
    - apt-get -qq -y install g++-14
    - apt-get -qq -y install libomp-dev
    - apt-get -qq -y install python3 pip
    - apt-get -qq -y install python-is-python3
    - apt-get -qq -y install libhdf5-dev
    - update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 800 --slave /usr/bin/g++ g++ /usr/bin/g++-14
    - update-alternatives --install /usr/bin/gfortran gfortran /usr/bin/gfortran-14 800
    - apt -qq -y install python3-scipy
    - apt-get -qq -y install cmake
    - apt-get -qq -y install libopenblas-dev liblapack-dev
    - export TOOLKIT="GNU"
    - gfortran --version
    - gcc --version
    - g++ --version
    - python3 --version
    - git --version
    - cmake --version
  tags:
    - $RUNNER_TAG
  artifacts:
    when: on_failure
    paths:
      - build/test*
      - build/Testing
    expire_in: 3 days
  interruptible: true
