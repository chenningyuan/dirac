#############################################################################
#
# GitLab CI buildup script for the DIRAC program suite.
#
# Contains 32-bit and 64-bit builds, both serial and parallel 
#
# Written by Radovan BAST, Tromso, Norway
#            Miroslav ILIAS, Mate Bel University, Banska Bystrica, Slovakia
#
#############################################################################


variables:
  GIT_SSL_NO_VERIFY: "true"
  GIT_STRATEGY: "clone"
  GIT_SUBMODULE_STRATEGY: "recursive"

ubuntu_serial32-check:
  image: ubuntu
  before_script:
    - apt-get -qq update
    - apt-get -qq -y install cmake
    - apt-get -qq -y install gfortran
    - apt-get -qq -y install gcc
    - apt-get -qq -y install g++
    - apt-get -qq -y install python python-pip
    - pip install sphinx matplotlib sphinx_rtd_theme hieroglyph sphinxcontrib-bibtex
  script:
#             do the serial buildup 
#    ...determine number of processors
    - echo "The shell is $SHELL"
    - let "N_PROC=$(cat /proc/cpuinfo | grep processor | wc -l)"
    - echo "Number of processors/jobs for the serial build step is $N_PROC"
    - ./setup --check --cmake-options="-D ENABLE_UNIT_TESTS=ON" build_serial
    - cd build_serial
    - make
#    Parallel build deactivated till dependency problem is solved
#    - make -j $N_PROC
    - ctest -VV -j $N_PROC -E basis_input_scripted -L short # exclude long (failing) test
#  do the documentation buildup
    - make -j $N_PROC html

ubuntu_parallel32-check:
  image: ubuntu
  before_script:
    - apt-get -qq update
    - apt-get -qq -y install cmake
    - apt-get -qq -y install gfortran
    - apt-get -qq -y install gcc
    - apt-get -qq -y install g++
    - apt-get -qq -y install openmpi-bin libopenmpi-dev openssh-client openssh-server
    - apt-get -qq -y install python 
  script:
#   do the parallel buildup here
#    ...determine number of processors
    - echo "The shell is $SHELL"
    - let "N_PROC=$(cat /proc/cpuinfo | grep processor | wc -l)"
    - echo "Number of processors/jobs for the build step is N_PROC=$N_PROC"
    - let "TEST_N_PROC=$(expr $(cat /proc/cpuinfo | grep processor | wc -l) / 2)" || TEST_N_PROC=1 # if only 1CPU on worker 
    - echo "Number of processors/jobs for parallel test step is TEST_N_PROC=$TEST_N_PROC"
    - ./setup --mpi --check --cmake-options="-D ENABLE_UNIT_TESTS=ON" build_parallel32
    - cd build_parallel32
    - make
#    Parallel build deactivated till dependency problem is solved
#    - make -j $N_PROC
    - ldd dirac.x
    - export DIRAC_MPI_COMMAND="mpirun --allow-run-as-root -np 2"
    - echo "The command DIRAC_MPI_COMMAND=$DIRAC_MPI_COMMAND"
    - ctest -VV -j $TEST_N_PROC -E "(basis_input_scripted|polprp_ph|dft_overlap_diagnostic)" -L short


ubuntu_parallel64-check:
  image: ubuntu
  before_script:
    - apt-get -qq update
    - apt-get -qq -y install cmake
    - apt-get -qq -y install gfortran
    - apt-get -qq -y install gcc
    - apt-get -qq -y install g++
    - apt-get -qq -y install openmpi-bin libopenmpi-dev openssh-client openssh-server
    - apt-get -qq -y install python 
  script:
#   do the parallel buildup here
#    ...determine number of processors
    - echo "The shell is $SHELL"
    - let "N_PROC=$(cat /proc/cpuinfo | grep processor | wc -l)"
    - echo "Number of processors/jobs for the build step is N_PROC=$N_PROC"
    - let "TEST_N_PROC=$(expr $(cat /proc/cpuinfo | grep processor | wc -l) / 2)" || TEST_N_PROC=1 # if only 1CPU on worker 
    - echo "Number of processors/jobs for parallel test step is TEST_N_PROC=$TEST_N_PROC"
    - ./setup --mpi --int64 --lapack=off --blas=off --cmake-options="-D ENABLE_BUILTIN_BLAS=ON -D ENABLE_BUILTIN_LAPACK=ON -D ENABLE_UNIT_TESTS=ON" --check build_parallel64
    - cd build_parallel64
    - make
#    Parallel build deactivated till dependency problem is solved
#    - make -j $N_PROC
    - ldd dirac.x
    - export DIRAC_MPI_COMMAND="mpirun --allow-run-as-root -np 2"
    - echo "The command DIRAC_MPI_COMMAND=$DIRAC_MPI_COMMAND"
    - ctest -VV -j $TEST_N_PROC -E "(basis_input_scripted|bss_energy|lucita_short|lucita_q_corrections|atomic_x2c_2esoc_models_energy|pe_energy|pe_response|pe_exc|lucita_large)" -L short
