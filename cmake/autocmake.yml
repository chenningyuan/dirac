name: DIRAC

min_cmake_version: 2.8

url_root: https://github.com/coderefinery/autocmake/raw/master/

modules:
- fc:
  - source: '%(url_root)modules/fc.cmake'
- cc:
  - source: '%(url_root)modules/cc.cmake'
- cxx:
  - source: '%(url_root)modules/cxx.cmake'
- flags:
  - source:
    - 'custom/compiler_flags/Clang.C.cmake'
    - 'custom/compiler_flags/Clang.CXX.cmake'
    - 'custom/compiler_flags/GNU.C.cmake'
    - 'custom/compiler_flags/GNU.CXX.cmake'
    - 'custom/compiler_flags/GNU.Fortran.cmake'
    - 'custom/compiler_flags/Intel.C.cmake'
    - 'custom/compiler_flags/Intel.CXX.cmake'
    - 'custom/compiler_flags/Intel.Fortran.cmake'
    - 'custom/compiler_flags/PGI.C.cmake'
    - 'custom/compiler_flags/PGI.CXX.cmake'
    - 'custom/compiler_flags/PGI.Fortran.cmake'
    - 'custom/compiler_flags/XL.C.cmake'
    - 'custom/compiler_flags/XL.CXX.cmake'
    - 'custom/compiler_flags/XL.Fortran.cmake'
- definitions:
  - source: '%(url_root)modules/definitions.cmake'
- builtin_math:
  - source: 'custom/builtin_math.cmake'
- python_interpreter:
  - source: '%(url_root)modules/python_interpreter.cmake'
- math:
  - source: '%(url_root)modules/math_libs.cmake'
- CheckFortranSourceCompiles:  # DIRAC MPI section needs this to run configure-time checks
  - source: 'custom/CheckFortranSourceCompiles.cmake'
- CMakeDependentOption:  # in CMake since 3.0
  - source: 'https://github.com/Kitware/CMake/raw/master/Modules/CMakeDependentOption.cmake'
- mpi:
  - source: '%(url_root)modules/mpi.cmake'
- coverage:
  - source: '%(url_root)modules/code_coverage.cmake'
- explicit:
  - docopt: "--explicit-libs=<LIBS> Explicit linker specification for extra libraries passed directly to the linker [default: off]."
  - define: "'-DEXPLICIT_LIBS=\"{0}\"'.format(arguments['--explicit-libs'].strip())"
- static:
  - source: 'custom/static_linking.cmake'
- profiling:
  - source: 'custom/profiling.cmake'
- runtime_checks:
  - source: 'custom/runtimecheck.cmake'
- int64:
  - source: '%(url_root)modules/int64.cmake'
- safeguards:
  - source: '%(url_root)modules/safeguards.cmake'
- git_info:
  - source: '%(url_root)modules/git_info/git_info.cmake'
- version:
  - source: '%(url_root)modules/version.cmake'
- main1:
  - source:
    - 'custom/mpi.cmake'
    - 'custom/test.cmake'
    - 'custom/exported.cmake'
    - 'custom/unreleased.cmake'
    - 'custom/reset_external_libs.cmake'
    - 'custom/static.cmake'
    - 'custom/definitions.cmake'
    - 'custom/matlab.cmake'
    - 'custom/qdiag.cmake'
    - 'custom/work_array.cmake'
    - 'custom/workarounds.cmake'
    - 'custom/external.cmake'
    - 'custom/pcm.cmake'
- src:
  - source: '%(url_root)modules/src.cmake'
- main2:
  - source:
    - 'custom/benchmarks.cmake'
    - 'custom/external_libs.cmake'
    - 'custom/tutorials.cmake'
    - 'custom/basis_set_check.cmake'
    - 'custom/unit/unit_tests.cmake'
    - 'custom/core.cmake'
    - 'custom/c_fortran_interface.cmake'
    - 'custom/doxygen.cmake'
    - 'custom/sphinx.cmake'
    - 'custom/install.cmake'
    - 'custom/cpack.cmake'
    - 'custom/pam.cmake'
    - 'custom/test.cmake'
- save_flags:
  - source: '%(url_root)modules/save_flags.cmake'
