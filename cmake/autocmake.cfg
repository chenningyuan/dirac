[project]
name: DIRAC
min_cmake_version: 2.8

[fc]
source: https://github.com/scisoft/autocmake/raw/master/modules/fc.cmake

[cc]
source: https://github.com/scisoft/autocmake/raw/master/modules/cc.cmake

[cxx]
source: https://github.com/scisoft/autocmake/raw/master/modules/cxx.cmake

[flags]
source: custom/compiler_flags/Clang.C.cmake
        custom/compiler_flags/Clang.CXX.cmake
        custom/compiler_flags/GNU.C.cmake
        custom/compiler_flags/GNU.CXX.cmake
        custom/compiler_flags/GNU.Fortran.cmake
        custom/compiler_flags/Intel.C.cmake
        custom/compiler_flags/Intel.CXX.cmake
        custom/compiler_flags/Intel.Fortran.cmake
        custom/compiler_flags/PGI.C.cmake
        custom/compiler_flags/PGI.CXX.cmake
        custom/compiler_flags/PGI.Fortran.cmake
        custom/compiler_flags/XL.C.cmake
        custom/compiler_flags/XL.CXX.cmake
        custom/compiler_flags/XL.Fortran.cmake

[definitions]
source: https://github.com/scisoft/autocmake/raw/master/modules/definitions.cmake

[builtin_math]
source: custom/builtin_math.cmake

[python_interpreter]
source: https://github.com/scisoft/autocmake/raw/master/modules/python_interpreter.cmake

[math]
source: https://github.com/scisoft/autocmake/raw/master/modules/math_libs.cmake

# DIRAC MPI section needs this to run configure-time checks
[CheckFortranSourceCompiles]
source: custom/CheckFortranSourceCompiles.cmake

[mpi]
source: https://github.com/scisoft/autocmake/raw/master/modules/mpi.cmake

[coverage]
source: https://github.com/scisoft/autocmake/raw/master/modules/code_coverage.cmake

[explicit]
docopt: --explicit-libs=<LIBS> Explicit linker specification for extra libraries passed directly to the linker [default: off].
define: '-DEXPLICIT_LIBS=%s' % arguments['--explicit-libs'].strip()

[static]
source: custom/static_linking.cmake

[int64]
source: https://github.com/scisoft/autocmake/raw/master/modules/int64.cmake

[safeguards]
source: https://github.com/scisoft/autocmake/raw/master/modules/safeguards.cmake

[git_info]
source: https://github.com/scisoft/autocmake/raw/master/modules/git_info/git_info.cmake

[version]
source: https://github.com/scisoft/autocmake/raw/master/modules/version.cmake

[main]
source: custom/mpi.cmake
	custom/reset_external_libs.cmake
	custom/static.cmake
	custom/pamadm.cmake
	custom/definitions.cmake
	custom/matlab.cmake
	custom/qdiag.cmake
	custom/work_array.cmake
	custom/external_libs.cmake
	custom/workarounds.cmake
	custom/external.cmake
        custom/unit_tests.cmake
        custom/xcfun.cmake
        custom/pcm.cmake
        custom/main.cmake
	custom/c_fortran_interface.cmake
        custom/doxygen.cmake
        custom/sphinx.cmake
	custom/install.cmake
	custom/cpack.cmake
	custom/pam.cmake
	custom/test.cmake
