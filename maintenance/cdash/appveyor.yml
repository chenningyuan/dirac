version: 1.0.{build}
init:
- ps: >-
    mkdir C:\software


    cd C:\software


    echo "installing compilers"


    wget http://netcologne.dl.sourceforge.net/project/mingw-w64/Toolchains%20targetting%20Win64/Personal%20Builds/mingw-builds/4.9.2/threads-posix/seh/x86_64-4.9.2-release-posix-seh-rt_v4-rev2.7z -OutFile MinGW.7z


    7z x MinGW.7z > log_mingw.txt


    echo "installing boost"


    wget http://netcologne.dl.sourceforge.net/project/boost/boost/1.57.0/boost_1_57_0.7z -OutFile Boost.7z


    7z x Boost.7z > log_boost.txt


    cd boost_1_57_0


    .\bootstrap.bat mingw


    .\b2 --with-system --with-filesystem --with-test --with-chrono --with-timer toolset=gcc install


    cd ..


    echo "installing zlib"


    wget http://garr.dl.sourceforge.net/project/mingw-w64/External%20binary%20packages%20%28Win64%20hosted%29/Binaries%20%2864-bit%29/zlib-1.2.5-bin-x64.zip -OutFile zlib.zip


    7z x zlib.zip > log_zlib.txt


    mv .\zlib "C:\Program Files\"


    echo "back to project source"


    cd C:\projects\pcmsolver
