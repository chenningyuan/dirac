##
##
## Simple DIRAC buildup configuration file for the codefresh.io CI service 
## .. reads repo from private bitbucket repo of Miro Ilias
##
##       see https://docs.codefresh.io/docs/freestyle
##

version: '1.0'
steps:
  system_info:
    title: print system info
    image: docker_repo
    commands:
      - lscpu
      - echo nproc=$(nproc)
      - pwd
      - df -h
      - free -g -h
      - cmake --version
      - python -V
      - mpif90 --version
      - mpirun --version

  dirac_build:
    title: own build of DIRAC
    image: docker_repo
    working_directory: ${{main_clone}}
    environment:
      - DIRAC_MPI_COMMAND="mpirun -np 2"
      - CTEST_PROJECT_NAME="DIRACext"
    when:
      branch:
        only: [ master ]
    commands:
      - git submodule update --init --recursive
      - python ./setup --fc=mpif90 --cc=mpicc --cxx=mpicxx --int64 --mpi --cmake-options="-D BUILDNAME='mpich2.gnu.i8-codefresh' -D DART_TESTING_TIMEOUT=99999 -D ENABLE_UNIT_TESTS=ON -D ENABLE_BASIS_SETS_CHECK=ON" build
      - cd build
      - ctest -D ExperimentalConfigure
      - ctest -j $(nproc) -D ExperimentalBuild
      - ldd dirac.x
# if some tests fail build/ctest can continue because of: || true
      - ctest -j $(nproc)  -D ExperimentalTest -L short || true
      - ctest -D ExperimentalSubmit

