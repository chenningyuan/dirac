## Simple DIRAC buildup configuration file for circleci.com
##
## See https://circleci.com/docs/getting-started
##     https://circleci.com/docs/configuration
##     https://circleci.com/docs/config-sample
##
## OpenMPI: http://particlephysicsandcode.com/2012/11/04/installing-open-mpi-1-6-3-ubuntu-12-04-fedora/
##

# set environment variable for Dirac MPI command
machine:
    environment:
        DIRAC_MPI_COMMAND: "mpirun -np 2"

dependencies:
    override:
# update software info
        - sudo apt-get update
# install/upgrade some packages - including OpenMPI
        - sudo apt-get install gcc g++ gfortran 
        - sudo apt-get install make cmake 
        - sudo apt-get install libblas-dev:amd64 liblapack-dev:amd64
#       - sudo apt-get install lib64z1 lib64z1-dev
        - sudo apt-get install openmpi-bin:amd64 libopenmpi-dev:amd64
        - sudo apt-get install doxygen
        - sudo apt-get install python-dev
        - sudo apt-get install python-dateutil
        - sudo apt-get install python-pyparsing
        - sudo apt-get install python-numpy
        - sudo apt-get install python-matplotlib
        - sudo pip install sphinx==1.2.3
        - sudo pip install sphinxcontrib-bibtex
        - sudo pip install sphinx_rtd_theme
        - sudo pip install hieroglyph

# update submodules
checkout:
    post:
        - git submodule sync
        - git submodule update --init

test:
    pre:
# show info about available processors
        - lscpu
# show available disc space
        - df -h
# show available memory
        - free -m
    override:
# configure, build and test - with OpenMPI
        - python ./pamadm -a --builddir=build_circleci_mpi
        - python ./setup -D BUILDNAME="open_mpi.gnu.i8-circle-ci" --int64 --mpi --type=debug -D DART_TESTING_TIMEOUT=99999 build_circleci_mpi
        - ctest --track Miro -D ExperimentalUpdate: { pwd: build_circleci_mpi }
        - ctest --track Miro -D ExperimentalConfigure: { pwd: build_circleci_mpi }
        - ctest -j 32 --track Miro -D ExperimentalBuild: { pwd: build_circleci_mpi }
# ldd - show dependencies
        - ldd dirac.x: { pwd: build_circleci_mpi }
        - ctest -j 8 --track Miro -VV -D ExperimentalTest -L short: { pwd: build_circleci_mpi }
        - ctest --track Miro -D ExperimentalSubmit: { pwd: build_circleci_mpi }
# build docs
        - make html: { pwd: build_circleci_mpi }
        - make doxygen: { pwd: build_circleci_mpi }
        - make slides: { pwd: build_circleci_mpi }
