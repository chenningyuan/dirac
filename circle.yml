## simple DIRAC buildup configuration file for circleci.com
## See https://circleci.com/docs/configuration
##     https://circleci.com/docs/config-sample


checkout:
  post:
    - git submodule sync
    - git submodule update --init

test: 
  override: 
    - python ./pamadm -a --builddir=build_circleci 
    - python ./setup --type=debug --int64 build_circleci
    - ctest -D NightlyUpdate: { pwd: build_circleci }
    - ctest -D NightlyConfigure: { pwd: build_circleci }
    - ctest -D NightlyBuild: { pwd: build_circleci }
    - ctest -D NightlyTest -R cosci_energy: { pwd: build_circleci }
    - ctest -D NightlyUpdate: { pwd: build_circleci }
